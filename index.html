<!doctype html>

    <!-- Preload critical above-the-fold hero image -->
    <link rel="preload" as="image" href="/images/hero/hero-main.webp" fetchpriority="high" />

    <!-- Preconnect to Google Fonts (establishes TCP+TLS early) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Non-render-blocking font load:
      1. Load as print (instantly non-blocking)
      2. onload switches media="all" so it applies after page paints
      3. Reduced Fraunces to 4 weights (was 10) — ~60% smaller font payload
         Used weights: 300/400 italic for headlines, 400/700 for body+bold
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600&display=swap" />
    </noscript>
